# The Work Context has exactly one implementation and it lives in
# codefly-dev/core. TestNoSecondWorkContextImplementation guards the tree it
# runs in; this workflow is the half of that guarantee a test cannot reach.
#
# A branch's CI run uses that branch's own tree and workflow, so a test added on
# main never executes on compat/v0.1.65. The release lines that still carry the
# deleted JSON implementation would stay green containing exactly what the rule
# forbids. This sweep reads every ref CI builds out of the object database
# instead, so the rule is true of the repository rather than of one branch.
#
# It is NOT a pull-request check, on purpose. The refs it names are retired by
# the owner at the cold cutover; until then it is red by design — a visible
# countdown rather than a silence. See docs/cutover.md.
name: one implementation

on:
  push:
    branches: [ main ]
  schedule:
    # Weekly, so a reintroduction on a branch nobody pushed to is still found,
    # and so the countdown stays visible without anyone pushing anything.
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: sdk-go-one-implementation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: no second Work Context implementation, on any ref CI builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The sweep reads other refs, so it needs them: a shallow checkout of
          # one branch would report "no refs to sweep" and pass for the wrong
          # reason, which the script refuses to do.
          fetch-depth: 0
      - name: Fetch every branch CI builds
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Sweep
        run: ./scripts/check-one-implementation.sh
