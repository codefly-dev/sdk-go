# The Work Context has exactly one implementation and it lives in
# codefly-dev/core. TestNoSecondWorkContextImplementation guards the workcontext
# module; this sweeps the whole repository, which is the half that test cannot
# reach — it walks from the workcontext module root, and the implementation this
# repository deleted lived at the ROOT in package codefly.
#
# It is a REQUIRED pull-request check and it is green. It was neither: it ran
# only on main and on a schedule, and it swept other refs so that it was red
# while three branches still carried the deleted implementation — a documented
# compatibility period, which is the opposite of the rule it was added to
# enforce. Which refs still carry it, and when they are deleted, belongs to the
# cold-cutover runbook outside this repository; the gate here says only that the
# ref CI is building carries no second implementation, and it says it green.
name: one implementation

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sdk-go-one-implementation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: no second Work Context implementation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sweep
        run: ./scripts/check-one-implementation.sh
