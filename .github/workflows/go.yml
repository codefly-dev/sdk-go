name: codefly go SDK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: sdk-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        gate:
          - module-consistency
          - lint
          - coverage
          - race
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check module consistency
        if: matrix.gate == 'module-consistency'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint
        if: matrix.gate == 'lint'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test with coverage
        if: matrix.gate == 'coverage'
        run: go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...

      - name: Check test coverage
        if: matrix.gate == 'coverage'
        id: coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yaml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      - name: Test with race detection
        if: matrix.gate == 'race'
        run: go test -race ./... -v
