name: codefly go SDK

on:
  # ANY branch a consumer can pin is a published artifact and is built like
  # one. This used to name compat/** as "the release lines consumers pin",
  # which was a rule about a naming convention: a consumer pins a commit, and
  # go.mod records a pseudo-version with no idea what the branch was called.
  # The one-implementation sweep covers every published ref for the same
  # reason, and a dependabot branch carrying the deleted implementation is what
  # showed the convention was doing no work.
  # So the triggers name no convention either. They said `compat/**` for three
  # revisions after the comment above stopped saying it, which meant a branch a
  # consumer can pin — a dependabot branch, say — was never built and never
  # swept by its own push, while the comment claimed every published ref was
  # held to the rule.
  push:
    branches: [ '**' ]
  pull_request:

concurrency:
  group: sdk-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-consistency:
    name: module-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    steps:
      - name: Checkout
        # fetch-depth 0 so the TAGS are present.
        # TestEveryPublishedTagCarryingTheImplementationIsRetracted sweeps every
        # published tag and refuses to pass having seen none — nineteen of them
        # publish the deleted implementation and a tag can only be retracted,
        # never fixed. A shallow checkout would have made that gate green by
        # looking at nothing.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Check module consistency
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The sweep lives HERE, in the workflow that builds every ref this repository
  # publishes, rather than in one of its own that ran on main alone. go.yml's
  # own `on:` is the statement of which refs are built, so a gate that has to
  # hold on all of them belongs beside the build rather than beside a list of
  # refs that drifts from it.
  #
  # The job's name is load-bearing: the active ruleset on main requires the
  # status check "no second Work Context implementation" by that exact context,
  # so renaming this job would leave a required check that never reports.
  one-implementation:
    name: no second Work Context implementation
    runs-on: ubuntu-latest
    # Ten, not five. This job sweeps the working tree and every published ref,
    # reading imports with go/parser — one `git cat-file` per Go file per ref.
    # Measured locally between 22s and 131s depending only on the OS file
    # cache, and a CI runner is slower than that. A gate that times out is a
    # gate somebody deletes, and the honest answer to "the gates cost more now"
    # is to say what they cost.
    timeout-minutes: 10
    steps:
      - name: Checkout
        # fetch-depth 0 so every published ref is reachable: the second step
        # reads them out of the object database.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        # The sweep reads imports with go/parser now (scripts/importsof),
        # because a regex over lines cannot read Go — `import
        # "\x63rypto/ed25519"` compiles and is crypto/ed25519 to the compiler.
        # So this job needs a toolchain, which it did not before.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build the import reader once
        # Built once and passed to every invocation, rather than rebuilt for
        # each of ~25 refs.
        run: |
          go build -o "$RUNNER_TEMP/importsof" ./scripts/importsof
          echo "IMPORTSOF_BIN=$RUNNER_TEMP/importsof" >> "$GITHUB_ENV"
      - name: Sweep every tracked Go file for a second implementation
        run: ./scripts/check-one-implementation.sh
      - name: Sweep every OTHER ref this repository publishes
        # The logic lives in scripts/sweep-published-refs.sh so it can be
        # TESTED. Inline, it was wrong and nothing could notice: it listed refs
        # with `git for-each-ref 'refs/remotes/origin/*'`, and `*` does not
        # cross a slash, so every namespaced branch was silently dropped. This
        # step reported "sweeping 1 other published ref(s)" and "ok
        # origin/badges" and went GREEN while
        # origin/dependabot/go_modules/gomod-06d3dc2861 published
        # workcontext/work_context.go importing crypto/ed25519.
        #
        # The script lists by prefix and asserts SWEPT AGAINST WHAT THE REMOTE
        # PUBLISHES, because a gate that sweeps a subset and reports success is
        # worse than no gate — the green is the evidence somebody acts on.
        run: |
          git fetch --no-tags --prune --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*'
          ./scripts/sweep-published-refs.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    steps:
      - name: Checkout
        # fetch-depth 0 so the TAGS are present.
        # TestEveryPublishedTagCarryingTheImplementationIsRetracted sweeps every
        # published tag and refuses to pass having seen none — nineteen of them
        # publish the deleted implementation and a tag can only be retracted,
        # never fixed. A shallow checkout would have made that gate green by
        # looking at nothing.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Ten: the root suite now includes the published-tag audit, which
    # sweeps 83 tags through the import reader. Measured 22s-131s on a warm
    # versus cold file cache.
    timeout-minutes: 10
    permissions:
      contents: write
    # The receipts store is written in the caller's transaction, admits on a
    # Postgres advisory lock and is idempotent on a primary key. Its tests skip
    # without a database, so the job that would report them green is the job
    # that has to provide one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codefly
          POSTGRES_PASSWORD: codefly
          POSTGRES_DB: receipts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codefly -d receipts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODEFLY_TEST_POSTGRES_DSN: postgres://codefly:codefly@localhost:5432/receipts?sslmode=disable
    steps:
      - name: Checkout
        # fetch-depth 0 so the TAGS are present.
        # TestEveryPublishedTagCarryingTheImplementationIsRetracted sweeps every
        # published tag and refuses to pass having seen none — nineteen of them
        # publish the deleted implementation and a tag can only be retracted,
        # never fixed. A shallow checkout would have made that gate green by
        # looking at nothing.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test with coverage
        run: go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...
      - name: Check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2
        with:
          config: ./.testcoverage.yaml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges
      - name: Check workcontext test coverage
        working-directory: workcontext
        run: |
          go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "workcontext total coverage: ${total}%"
          awk "BEGIN { exit !(${total} >= 75) }"

  race:
    name: race
    runs-on: ubuntu-latest
    # Ten: the root suite now includes the published-tag audit, which
    # sweeps 83 tags through the import reader. Measured 22s-131s on a warm
    # versus cold file cache.
    timeout-minutes: 10
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    # The receipts store is written in the caller's transaction, admits on a
    # Postgres advisory lock and is idempotent on a primary key. Its tests skip
    # without a database, so the job that would report them green is the job
    # that has to provide one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codefly
          POSTGRES_PASSWORD: codefly
          POSTGRES_DB: receipts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codefly -d receipts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODEFLY_TEST_POSTGRES_DSN: postgres://codefly:codefly@localhost:5432/receipts?sslmode=disable
    steps:
      - name: Checkout
        # fetch-depth 0 so the TAGS are present.
        # TestEveryPublishedTagCarryingTheImplementationIsRetracted sweeps every
        # published tag and refuses to pass having seen none — nineteen of them
        # publish the deleted implementation and a tag can only be retracted,
        # never fixed. A shallow checkout would have made that gate green by
        # looking at nothing.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Test with race detection
        working-directory: ${{ matrix.module }}
        run: go test -race ./... -v
