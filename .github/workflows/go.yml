name: codefly go SDK

on:
  # compat/** carries the release lines consumers pin when main holds an
  # unreleased breaking change. A branch whose commits are pinned by a consumer
  # is a published artifact, so it is built like one.
  push:
    branches: [ main, 'compat/**' ]
  pull_request:
    branches: [ main, 'compat/**' ]

concurrency:
  group: sdk-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-consistency:
    name: module-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Check module consistency
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The sweep lives HERE, in the workflow that builds every ref this repository
  # publishes, rather than in one of its own that ran on main alone. go.yml's
  # own `on:` is the statement of which refs are built, so a gate that has to
  # hold on all of them belongs beside the build rather than beside a list of
  # refs that drifts from it.
  #
  # The job's name is load-bearing: the active ruleset on main requires the
  # status check "no second Work Context implementation" by that exact context,
  # so renaming this job would leave a required check that never reports.
  one-implementation:
    name: no second Work Context implementation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # fetch-depth 0 so every published ref is reachable: the second step
        # reads them out of the object database.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Sweep every tracked Go file for a second implementation
        run: ./scripts/check-one-implementation.sh
      - name: Sweep every OTHER ref this repository publishes
        # EVERY REMOTE BRANCH, not a name glob — minus the one this change is
        # becoming, which the working-tree step above already swept.
        #
        # The previous revision swept 'compat/*' and 'feat/*compat*', which was
        # a rule about ref NAMES in a gate whose whole subject is that the
        # implementation is gone. Measured: of 25 remote branches, 22 carried
        # work_context.go, so retiring the three named compat refs would have
        # turned this step green with 19 copies still published — on branches a
        # consumer can pin exactly as it pins a compat ref. The owner has since
        # deleted all of them, which is what makes a COMPLETE sweep possible
        # rather than a documented gap.
        #
        # The base branch and this branch are excluded, and that is not a hole:
        # sweeping the ref a pull request merges INTO is circular. main still
        # carries workcontext/work_context.go, this pull request is what deletes
        # it, and a check that stayed red until main was clean could never let
        # the change that cleans it land. main is covered by the working-tree
        # step of its own push build — the same sweep over the same files one
        # commit later.
        #
        # It also no longer FAILS OPEN. `fetch || true` followed by "no refs,
        # exit 0" meant a network failure, a permissions change or a renamed
        # remote all reported success — the three cases where a gate is most
        # needed and least able to say so.
        run: |
          git fetch --no-tags --prune --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*'
          base="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-main}}"
          here="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          # Collected into an array rather than word-split from a string, so a
          # ref name with a space cannot silently become two arguments.
          refs=()
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            case "$ref" in
              origin|origin/HEAD) continue ;;
              "origin/$base") continue ;;
            esac
            if [ -n "$here" ] && [ "$ref" = "origin/$here" ]; then
              continue
            fi
            refs+=("$ref")
          done < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/*')
          echo "sweeping ${#refs[@]} other published ref(s); the working tree was swept above"
          if [ ${#refs[@]} -eq 0 ]; then
            # Not a pass by default: the fetch above is what would have failed.
            echo "this repository publishes no ref other than $base"
            exit 0
          fi
          ./scripts/check-one-implementation.sh "${refs[@]}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # The receipts store is written in the caller's transaction, admits on a
    # Postgres advisory lock and is idempotent on a primary key. Its tests skip
    # without a database, so the job that would report them green is the job
    # that has to provide one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codefly
          POSTGRES_PASSWORD: codefly
          POSTGRES_DB: receipts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codefly -d receipts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODEFLY_TEST_POSTGRES_DSN: postgres://codefly:codefly@localhost:5432/receipts?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test with coverage
        run: go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...
      - name: Check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2
        with:
          config: ./.testcoverage.yaml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges
      - name: Check workcontext test coverage
        working-directory: workcontext
        run: |
          go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "workcontext total coverage: ${total}%"
          awk "BEGIN { exit !(${total} >= 75) }"

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    # The receipts store is written in the caller's transaction, admits on a
    # Postgres advisory lock and is idempotent on a primary key. Its tests skip
    # without a database, so the job that would report them green is the job
    # that has to provide one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codefly
          POSTGRES_PASSWORD: codefly
          POSTGRES_DB: receipts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codefly -d receipts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODEFLY_TEST_POSTGRES_DSN: postgres://codefly:codefly@localhost:5432/receipts?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Test with race detection
        working-directory: ${{ matrix.module }}
        run: go test -race ./... -v
