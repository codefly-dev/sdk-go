name: codefly go SDK

on:
  # compat/** carries the release lines consumers pin when main holds an
  # unreleased breaking change. A branch whose commits are pinned by a consumer
  # is a published artifact, so it is built like one.
  push:
    branches: [ main, 'compat/**' ]
  pull_request:
    branches: [ main, 'compat/**' ]

concurrency:
  group: sdk-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-consistency:
    name: module-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Check module consistency
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # The receipts store is written in the caller's transaction, admits on a
    # Postgres advisory lock and is idempotent on a primary key. Its tests skip
    # without a database, so the job that would report them green is the job
    # that has to provide one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codefly
          POSTGRES_PASSWORD: codefly
          POSTGRES_DB: receipts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codefly -d receipts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODEFLY_TEST_POSTGRES_DSN: postgres://codefly:codefly@localhost:5432/receipts?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Test with coverage
        run: go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...
      - name: Check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2
        with:
          config: ./.testcoverage.yaml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges
      - name: Check workcontext test coverage
        working-directory: workcontext
        run: |
          go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "workcontext total coverage: ${total}%"
          awk "BEGIN { exit !(${total} >= 75) }"

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        module: [ ".", "workcontext" ]
    # The receipts store is written in the caller's transaction, admits on a
    # Postgres advisory lock and is idempotent on a primary key. Its tests skip
    # without a database, so the job that would report them green is the job
    # that has to provide one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codefly
          POSTGRES_PASSWORD: codefly
          POSTGRES_DB: receipts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codefly -d receipts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODEFLY_TEST_POSTGRES_DSN: postgres://codefly:codefly@localhost:5432/receipts?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download modules
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Test with race detection
        working-directory: ${{ matrix.module }}
        run: go test -race ./... -v
