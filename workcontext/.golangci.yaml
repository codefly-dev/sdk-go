version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        path: ^work_context\.go$
        text: "ST1005:"
    paths:
      - .*\.pb\.go
      - .*_test\.go
