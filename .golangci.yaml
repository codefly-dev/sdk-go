version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    rules:
      # ST1005 forbids a capitalized error string, which it cannot tell from a
      # proper noun: every sentinel in these files begins with "Codefly".
      - linters:
          - staticcheck
        path: (^|/)(runtime_environment_file|work_context|mint|stream)\.go$
        text: "ST1005:"
    paths:
      - .*\.pb\.go
      - .*_test\.go
